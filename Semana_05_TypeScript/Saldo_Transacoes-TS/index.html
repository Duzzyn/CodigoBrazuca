<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initialscale=1.0" />
    <title>Consulta de Saldo e Transações - Ethereum</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css"
    />
    <style>
      .is-flex {
        gap: 2em;
      }
    </style>
  </head>
  <body>
    <main>
      <div
        class="is-flex is-flex-direction-column is-justify-content-center is-align-items-center"
      >
        <h1 class="title is-1">Consulta de Saldo e Transações</h1>
        <input
          class="input is-rounded is-hovered"
          type="text"
          id="wallet-address"
          placeholder="Digite o
  endereço da carteira"
        />
        <div class="select">
          <select id="select">
            <option value="">Mainnet</option>
            <option value="">Rinkeby</option>
            <option value="">Kovan</option>
            <option value="">Ropsten</option>
          </select>
        </div>

        <div class="is-flex">
          <button id="check-balance" class="button is-medium">
            Consultar Saldo
          </button>
          <button id="check-transactions" class="button is-medium ">
            Ver Transações
          </button>
          <button id="check-nextTransactions" class="button is-medium ">
            Ver +5 Transações
          </button>
        </div>
        <p id="balance" class="has-text-white"></p>
        <div id="transactions"></div>
      </div>
    </main>

    <script src="bundle.js"></script>
  </body>
</html>
